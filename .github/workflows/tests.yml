on:
    push:
        branches:
            - main
            - v3-simplified

    pull_request:

jobs:
    check:
        name: 'Foundry Tests'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 24
                  check-latest: true
                  cache: 'yarn'

            - name: Install Foundry
              uses: onbjerg/foundry-toolchain@v1
              with:
                  version: v0.3.0

            - name: Install dependencies
              run: |
                  forge install
                  # hardhat 2.12 (used only by the deploy scripts) declares node <=18; CI only runs forge.
                  yarn --ignore-engines

            - name: Run forge build
              run: make build
              id: build
              env:
                  SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

            - name: Run unit tests with Sepolia fork
              run: make test
              env:
                  SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

            - name: Run invariant tests
              run: make test_invariant
            
            - name: Run fork tests (mainnet)
              run: make test_fork
              env:
                  ETH_RPC_URL: https://ethereum-rpc.publicnode.com
                  ETHERSCAN_API_KEY: "" 

            # Tells bulla-registry to consolidate now. The token comes from the bulla-registry-notify app, which
            # can only start workflows in bulla-registry (Actions: write), so its key can't change any code.
            - name: Mint a bulla-registry-notify token
              id: registry-notify
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.REGISTRY_NOTIFY_APP_ID }}
                  private-key: ${{ secrets.REGISTRY_NOTIFY_APP_PRIVATE_KEY }}
                  owner: bulla-network
                  repositories: bulla-registry
                  permission-actions: write

            - name: Notify bulla-registry
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ steps.registry-notify.outputs.token }}
              run: gh workflow run consolidate.yml -R bulla-network/bulla-registry -f source=${{ github.repository }}
